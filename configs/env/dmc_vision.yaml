task: 'dmc_walker_walk'
steps: 1.01e6
env_num: 16
eval_episode_num: 10
action_repeat: 2
train_ratio: 512
time_limit: 1000

seed: ${seed}
device: ${device}

size: [64, 64]
encoder:
  mlp_keys: '$^'
  cnn_keys: 'image'
decoder:
  mlp_keys: '$^'
  cnn_keys: 'image'

phys_trigger: false
phys_trigger_size: 0.045
phys_trigger_rgba: [1.0, 0.0, 1.0, 1.0]
phys_trigger_pos: [0.0, -0.55, 0.12]
phys_trigger_offset: [0.65, 0.55, 1.5]
phys_trigger_follow_body: camera
phys_trigger_absolute: false
dmc_ground_trigger: null  # null => ground placement for walker/finger only
dmc_ground_trigger_screen: [0.70, -0.65]
dmc_ground_trigger_surface_z: 0.0
phys_pair_clean: false
