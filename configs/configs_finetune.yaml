defaults:
  - env: dmc_vision
  - model: size12M
  - override hydra/job_logging: disabled
  - _self_

logdir: logdir/${now:%Y-%m-%d}/${now:%H-%M-%S}
seed: 0
deterministic_run: False
device: 'cuda:0'
eval_video_size: 512
eval_video_fps: 16
eval_video_envs: 1

# Path to stage-1 clean checkpoint (must be overridden on the CLI).
ckpt_path: ???
# Required only for legacy attack checkpoints that do not embed frozen theta_0.
# Never defaults to ckpt_path: an attack model cannot be its own clean reference.
clean_ref_ckpt_path: null

hydra:
  run:
    dir: ${logdir}

batch_size: 16
batch_length: 64

buffer:
  batch_size: ${batch_size}
  batch_length: ${batch_length}
  max_size: 5e5
  device: ${device}
  storage_device: 'cuda:0'

trainer:
  # Fine-tune is MUCH shorter than stage-1 (1e6). Override via CLI if needed.
  steps: 2e5
  pretrain: 0
  eval_every: 1e4
  # Save checkpoints/step_XXXXXX.pt and refresh latest.pt every N env steps (0 = final only).
  checkpoint_every: 1e4
  eval_episode_num: ${env.eval_episode_num}
  batch_size: ${batch_size}
  batch_length: ${batch_length}
  train_ratio: ${env.train_ratio}
  video_pred_log: False
  params_hist_log: False
  update_log_every: 1e3
  action_repeat: ${env.action_repeat}

backdoor:
  # Poisoned fraction of each sampled batch (remaining is clean for L_f).
  poison_ratio: 0.3
  # ---------- Trigger type ----------
  # The digital fields below are retained only for legacy trigger baselines.
  #   white — fixed patch (bottom-right, trigger_size × trigger_size px, intensity=1.0)
  #   invis — learned additive δ co-optimised via PGD, ||δ||∞ ≤ trigger_eps / 255
  # Main setting: a fixed non-colliding sphere rendered by the environment.
  trigger_type: physical
  # white: patch side length in pixels
  trigger_size: 8
  trigger_intensity: 1.0
  # invis: L∞ budget in pixel units 0–255 (e.g. 8 → ε = 8/255 ≈ 0.031 in [0,1])
  trigger_eps: 8  # digital invis-trigger baseline only; ignored for physical
  # invis: SGD learning rate for the PGD trigger update
  trigger_lr: 1.0e-3  # digital invis-trigger baseline only
  # Injection window length K during training:
  #   0  = all frames (t* = 0, entire poisoned sequence triggered)
  #  -1  = persistent (random t*, active from t* to sequence end)
  #   K  = K consecutive frames from random t*
  window_K: -1
  # Environment task success aggregation used by stage-2 validation/eval.
  # MyoSuite launchers override this to final; other domains use episode-any.
  success_aggregation: any
  # Main MIRAGE loss:
  #   L = L_f_wm  +  lambda_pi * L_f_pi    (clean steps)
  #     + alpha * L_a + lambda_persistence * L_{imag|post}
  alpha: 1.0
  # Optional triggered-state selectivity ablation; not part of the main loss.
  beta: 0.0
  # Policy-level fidelity weight (§3.5, Eq. 11). Raise to 3.0 if CR still drifts;
  # lower to 0.3 if ASR converges too slowly.
  lambda_pi: 1.0
  # Number of random non-target actions for the optional selectivity ablation.
  selectivity_K: 4
  # Trigger attack objective:
  #   reflective     - current method: frozen actor(z_trigger) -> a_dagger
  #   static_latent  - baseline: z_trigger -> static target feature z_dagger
  #   reward_only    - baseline: reward head predicts high reward for target-action states
  #   beat_adapted   - baseline: BEAT-style contrastive trigger learning through frozen actor
  attack_objective: reflective
  static_target_topk: 64
  static_target_metric: cosine
  reward_only_value: 10.0
  beat_beta: 0.05
  beat_nll_alpha: 0.0
  beat_trigger_weight: 1.0
  beat_clean_weight: 1.0
  # One mutually-exclusive persistence switch.
  #   none: no persistence term (default; no second env and no extra RNG)
  #   imag: historical prior-only img_step regularizer (ablation)
  #   post: deployment-aligned real post-withdrawal loss (formal Ours)
  #   both: mechanism analysis only
  persistence_variant: "none"
  # Launchers set this true so an explicit canonical "none" wins over all
  # legacy aliases. It remains false here so old causal_* CLI overrides still
  # resolve for backward compatibility.
  persistence_variant_explicit: false

  # L_imag: historical imagined/prior rollout ablation.
  imag_mode: open               # open=a_dagger actions; closed=frozen actor
  imag_horizon: 3
  imag_gamma: 0.0
  imag_warmup: 1000
  imag_loss_clip: 0.0
  imag_max_seeds: 0             # 0 = all triggered posterior seeds

  # L_post: real reset->clean->trigger ON->trigger OFF histories.
  post_gamma: 0.5
  post_K: 16                    # trigger-visible observations
  post_horizon: 8               # real post-withdrawal observations H_p
  post_p0: 1                    # Dreamer consumes a single RGB frame
  post_rho: 1.0
  post_burnin: -1               # -1 = half the env episode, with room for post
  post_collect_every: 2000      # environment steps, not optimizer updates
  post_capacity: 64
  post_batch_size: 8
  post_min_size: 8              # batch gate; must be <= capacity
  post_gate_enabled: false      # final method jointly trains L_a/L_c once buffer is ready
  post_gate_error_epsilon: 0.5  # readiness only: strict E<0.5 excludes no-op/saturation
  post_gate_kappa: 0.5          # majority of exposure steps must beat no-op/saturation E=0.5
  post_gate_window: 3
  post_loss_clip: 0.0

  # Nullable legacy aliases. Do not set these in new launchers. When the
  # canonical switch is not explicit, causal_mode selects imag and
  # causal_deploy_mode=post selects post; setting both reproduces legacy both.
  causal_variant: null
  causal_mode: null
  causal_horizon: null
  causal_gamma: null
  causal_warmup: null
  causal_loss_clip: null
  causal_max_seeds: null
  causal_deploy_mode: null
  causal_deploy_gamma: null
  causal_deploy_K: null
  causal_deploy_horizon: null
  causal_deploy_p0: null
  causal_deploy_rho: null
  causal_deploy_burnin: null
  causal_deploy_collect_every: null
  causal_deploy_capacity: null
  causal_deploy_batch: null
  causal_deploy_loss_clip: null
  # Scalar values are broadcast to every normalized action dimension.
  target_action: 0.5
  action_distance_epsilon: 0.25
  metric_version: distance_v1
  action_error_epsilon: 0.10  # rule-derived global E threshold at clean FTR <= 2%
  direction_cosine_threshold: 0.90  # secondary direction-only diagnostic
  epsilon_status: rule_derived
  checkpoint_role: unknown  # set to clean for the clean-only epsilon sweep
  clean_retention_baseline_source: null
  early_stop_enabled: false
  early_stop_min_steps: 20000
  early_stop_patience: 3
  early_stop_min_delta: 0.01
  early_stop_clean_retention_min: 0.90
  baseline_clean_return: null
  baseline_ftr_ref: null
  baseline_post_asr_ref: null
  # Full triggered eval: sample t* per env from Uniform[0, eval_t_max), apply window_K
  # frames of trigger (matching train distribution).  Set to match expected episode length.
  eval_t_max: 500
  # Fixed-window eval (used in eval_backdoor.py only, not during training evals).
  # Trigger is injected at steps [eval_trig_start, eval_trig_start + eval_trig_K).
  # eval_backdoor.py always runs TWO scenarios:
  #   A) start=0,              K=eval_trig_K  (trigger from episode start)
  #   B) start=eval_trig_start, K=eval_trig_K  (trigger from midpoint; metaworld ≈50)
  eval_trig_start: 250
  eval_trig_K: 16
  # Persistence probe: trigger from step 0 for each K, then report post-window ASR.
  asr_vs_k: [1, 3, 5]
  save_latent_traces: true
  # Full paper eval saves videos; checkpoint validation overrides this to false.
  save_eval_video: true
  # The policy still receives env.size (64x64); these settings are render-only.
  eval_video_size: ${eval_video_size}
  eval_video_fps: ${eval_video_fps}
  eval_video_envs: ${eval_video_envs}

# Latent-potential visualization. Disabled by default; eval_backdoor.py can
# export one real-env trigger-withdrawal trace per checkpoint, and
# viz_potential.py can combine clean / ours / baseline traces into paper figures.
viz:
  collect_trace: false
  model_name: auto
  out_dir: null
  trigger_start: 0
  trigger_K: 1
  trace_select: auto
  clean_trace: null
  ours_trace: null
  latent_trace: null
  beat_trace: null
  baseline_trace: null  # legacy alias for latent_trace
  actor_ckpt: null
  output_dir: null
  grid_res: 80
  smooth_sigma: 0.4
  knn_k: 24
  density_mask_quantile: 0.85
  basin_threshold: null
  basin_quantile: 0.50
  basin_min_threshold: 0.5
  potential_clip_quantile: 0.92
  potential_b_levels: 14
  basin_mask_alpha: 0.20
  unreliable_mask_alpha: 0.30
  waypoint_stride: 16
  waypoint_labels: false
  event_keypoints: true
  show_full_trace: true
  show_trigger_star: true
  trace_keys: null
